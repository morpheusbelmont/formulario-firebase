<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario con Firebase</title>
</head>
<body>
  <h2>Registro de Usuarios</h2>
  <form id="userForm">
    <label>Nombre:</label>
    <input type="text" id="nombre" required><br><br>

    <label>Email:</label>
    <input type="email" id="email" required><br><br>

    <label>Mensaje:</label>
    <textarea id="mensaje" required></textarea><br><br>

    <button type="submit">Guardar</button>
  </form>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAPTUxir0TDNm5Z8oplL5M-NQBzhrKaUuc",
    authDomain: "formularioweb-99db6.firebaseapp.com",
    projectId: "formularioweb-99db6",
    storageBucket: "formularioweb-99db6.firebasestorage.app",
    messagingSenderId: "333470951681",
    appId: "1:333470951681:web:efccefa9c6d6ae5c459300"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
</script>

<script>
    // Paso 2: Inicializar Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Paso 3: Capturar formulario
    const form = document.getElementById("userForm");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      let nombre = document.getElementById("nombre").value;
      let email = document.getElementById("email").value;
      let mensaje = document.getElementById("mensaje").value;

      // Paso 4: Guardar datos en Firebase
      db.ref("usuarios").push({
        nombre: nombre,
        email: email,
        mensaje: mensaje
      });

      alert("✅ Datos guardados en Firebase");
      form.reset();
    });
  </script>
</body>
</html>
