<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario con Firebase - Debug</title>
  <style>
    body{font-family: Arial, sans-serif;padding:20px}
    #status{margin:10px 0;font-weight:bold}
    table{border-collapse:collapse;width:100%;margin-top:10px}
    th,td{border:1px solid #ccc;padding:6px;text-align:left}
  </style>
</head>
<body>
  <h1>Registro de Usuarios</h1>

  <form id="userForm">
    <label>Nombre:</label>
    <input type="text" id="nombre" required><br><br>

    <label>Email:</label>
    <input type="email" id="email" required><br><br>

    <label>Mensaje:</label>
    <textarea id="mensaje" required></textarea><br><br>

    <button type="submit">Guardar</button>
  </form>

  <div id="status">Estado: —</div>

  <h2>Registros (en tiempo real)</h2>
  <table id="tbl">
    <thead><tr><th>Nombre</th><th>Email</th><th>Mensaje</th><th>Fecha</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    Timestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // --- TU CONFIGURACIÓN DE FIREBASE (usa la tuya) ---
  const firebaseConfig = {
    apiKey: "AIzaSyAPTUxir0TDNm5Z8oplL5M-NQBzhrKaUuc",
    authDomain: "formularioweb-99db6.firebaseapp.com",
    projectId: "formularioweb-99db6",
    storageBucket: "formularioweb-99db6.appspot.com",
    messagingSenderId: "333470951681",
    appId: "1:333470951681:web:efccefa9c6d6ae5c459300"
  };

  // Inicializar app y Firestore
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Helpers de UI
  const statusEl = document.getElementById('status');
  function setStatus(msg, isError=false){
    statusEl.textContent = 'Estado: ' + msg;
    statusEl.style.color = isError ? 'crimson' : 'green';
    console.log(msg);
  }

  const form = document.getElementById('userForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setStatus('Guardando...');
    const nombre = document.getElementById('nombre').value.trim();
    const email = document.getElementById('email').value.trim();
    const mensaje = document.getElementById('mensaje').value.trim();

    try {
      await addDoc(collection(db, 'usuarios'), {
        nombre, email, mensaje, fecha: Timestamp.fromDate(new Date())
      });
      setStatus('Guardado ✅');
      form.reset();
    } catch (err) {
      console.error('Error guardando:', err);
      setStatus('Error: ' + (err.message || err.code || err), true);
    }
  });

  // Listener en tiempo real para listar documentos y verificar que llegan
  const tbody = document.getElementById('tbody');
  const q = query(collection(db, 'usuarios'), orderBy('fecha', 'desc'));
  onSnapshot(q, (snapshot) => {
    tbody.innerHTML = '';
    snapshot.forEach(doc => {
      const d = doc.data();
      const fecha = d.fecha && d.fecha.toDate ? d.fecha.toDate().toLocaleString() : '';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${d.nombre||''}</td><td>${d.email||''}</td><td>${d.mensaje||''}</td><td>${fecha}</td>`;
      tbody.appendChild(tr);
    });
  }, (err) => {
    console.error('Listener error:', err);
    setStatus('Listener error: ' + (err.message || err.code || err), true);
  });

  setStatus('Listo — esperando envíos');
</script>
</body>
</html>
