<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario con Firebase y Firestore</title>
</head>
<body>
  <h2>Registro de Usuarios</h2>
  <form id="userForm">
    <label>Nombre:</label>
    <input type="text" id="nombre" required><br><br>

    <label>Email:</label>
    <input type="email" id="email" required><br><br>

    <label>Mensaje:</label>
    <textarea id="mensaje" required></textarea><br><br>

    <button type="submit">Guardar</button>
  </form>

<script type="module">
  // Importar Firebase modular
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Configuración de Firebase (tuya, la que ya tienes)
  const firebaseConfig = {
    apiKey: "AIzaSyAPTUxir0TDNm5Z8oplL5M-NQBzhrKaUuc",
    authDomain: "formularioweb-99db6.firebaseapp.com",
    projectId: "formularioweb-99db6",
    storageBucket: "formularioweb-99db6.firebasestorage.app",
    messagingSenderId: "333470951681",
    appId: "1:333470951681:web:efccefa9c6d6ae5c459300"
  };

  // Inicializar Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Capturar formulario
  const form = document.getElementById("userForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    let nombre = document.getElementById("nombre").value;
    let email = document.getElementById("email").value;
    let mensaje = document.getElementById("mensaje").value;

    try {
      await addDoc(collection(db, "usuarios"), {
        nombre: nombre,
        email: email,
        mensaje: mensaje,
        fecha: new Date()
      });
      alert("✅ Datos guardados en Firestore");
      form.reset();
    } catch (error) {
      console.error("❌ Error al guardar: ", error);
    }
  });
</script>
</body>
</html>
